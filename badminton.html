<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lathish - Badminton Achievements</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Typewriter effect */
    .typewriter {
      border-right: 3px solid;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
    }
    /* Blinking cursor for typewriter effect */
    .typewriter .caret {
      animation: blink-caret 0.75s step-end infinite;
    }
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: inherit; }
    }
    
    /* Timeline styling */
    .timeline-item {
      position: relative;
      padding-left: 2rem;
      margin-bottom: 3rem;
    }
    .timeline-item:before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
    }
    .timeline-dot {
      position: absolute;
      left: -8px;
      top: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid white; /* Ensures visibility over the line */
      z-index: 1; /* Puts the dot above the line */
    }
    
    /* Animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeInUp {
      animation: fadeInUp 0.6s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script>
    // ================== Components ==================

    function Header() {
      return React.createElement(
        'header',
        { className: 'bg-white shadow-sm sticky top-0 z-50' },
        React.createElement(
          'div',
          { className: 'max-w-6xl mx-auto px-4 py-4' },
          React.createElement(
            'div',
            { className: 'flex items-center justify-between' },
            [
              React.createElement(
                'a',
                { href: 'index.html', className: 'flex items-center space-x-3' },
                [
                  React.createElement(
                    'div',
                    { className: 'w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center' },
                    React.createElement('span', { className: 'text-white font-bold text-xl' }, 'L')
                  ),
                  React.createElement(
                    'div',
                    null,
                    [
                      React.createElement('h1', { className: 'text-2xl font-bold text-gray-900' }, 'Lathish'),
                      React.createElement('p', { className: 'text-sm text-gray-600' }, 'EAE Portfolio')
                    ]
                  )
                ]
              ),
              React.createElement(
                'nav',
                { className: 'hidden md:flex space-x-6' },
                [
                  React.createElement('a', { href: 'index.html#profile', className: 'text-gray-600 hover:text-blue-600 transition-colors' }, 'Profile'),
                  React.createElement('a', { href: '#', className: 'text-blue-600 font-medium' }, 'Badminton'),
                  React.createElement('a', { href: 'index.html#sports', className: 'text-gray-600 hover:text-blue-600 transition-colors' }, 'Sports'),
                  React.createElement('a', { href: 'index.html#academics', className: 'text-gray-600 hover:text-blue-600 transition-colors' }, 'Academics')
                ]
              )
            ]
          )
        )
      );
    }

    function Footer() {
      return React.createElement(
        'footer',
        { className: 'bg-gray-900 text-white py-8' },
        React.createElement(
          'div',
          { className: 'max-w-6xl mx-auto px-4 text-center' },
          React.createElement('p', { className: 'text-gray-400' }, '© 2024 Lathish - EAE Portfolio')
        )
      );
    }

    function TypewriterText({ text, speed = 20, initialDelay = 0 }) {
      const [displayText, setDisplayText] = React.useState('');
      const [isTyping, setIsTyping] = React.useState(false);
      
      React.useEffect(() => {
        let timeoutId;
        let intervalId;

        const startTyping = () => {
          setIsTyping(true);
          let i = 0;
          intervalId = setInterval(() => {
            if (i < text.length) {
              setDisplayText(text.substring(0, i + 1));
              i++;
            } else {
              clearInterval(intervalId);
              setIsTyping(false);
            }
          }, speed);
        };

        if (initialDelay > 0) {
          timeoutId = setTimeout(startTyping, initialDelay);
        } else {
          startTyping();
        }
        
        return () => {
          clearTimeout(timeoutId);
          clearInterval(intervalId);
        };
      }, [text, speed, initialDelay]);
      
      return React.createElement(
        'span',
        { className: 'typewriter' },
        [
          displayText,
          isTyping && React.createElement('span', { className: 'caret' }, '|') // Blinking cursor
        ]
      );
    }

    function BadmintonAchievements() {
      const achievements = [
        { year: '2023', event: 'Pilot Pen Cup', detail: 'Represented school at a local-level tournament', highlight: false, id: 'pilot-pen-2023' },
        { year: '2024', event: 'Yuhua CSN Badminton Competition', detail: 'Represented Singapore Schools, won Bronze Award', highlight: true, id: 'yuhua-csn-2024' },
        { year: '2022', event: 'School Intramural Tournament', detail: 'Participated and reached semi-finals', highlight: false, id: 'intramural-2022' },
        { year: '2025', event: 'National School Games', detail: 'Currently preparing for the upcoming season, aiming for top 3', highlight: false, id: 'nsg-2025' },
        { year: '2022', event: 'SYF Arts Presentation', detail: 'Participated in school band (CCA), awarded Certificate of Distinction', highlight: false, id: 'syf-2022' },
        { year: '2023', event: 'Badminton Leadership Camp', detail: 'Appointed as team leader, focused on developing team strategy and cohesion.', highlight: false, id: 'badminton-camp-2023' },
        { year: '2024', event: 'East Zone Badminton Competition', detail: 'Advanced to quarter-finals as part of the school team.', highlight: false, id: 'east-zone-2024' }
      ];

      // Sort achievements by year for chronological display (optional)
      achievements.sort((a, b) => parseInt(a.year) - parseInt(b.year));

      return React.createElement(
        'section',
        { className: 'py-16 bg-white' },
        React.createElement(
          'div',
          { className: 'max-w-4xl mx-auto px-4' },
          [
            React.createElement(
              'div',
              { className: 'text-center mb-12 animate-fadeInUp', style: { animationDelay: '0.2s' } },
              [
                React.createElement(
                  'h1',
                  { className: 'text-4xl font-bold text-gray-900 mb-6' },
                  React.createElement(TypewriterText, { text: '🏸 Badminton Journey', speed: 80, initialDelay: 500 })
                ),
                React.createElement(
                  'p',
                  { className: 'text-xl text-gray-600' },
                  'Representing school at various competitions since 2022'
                )
              ]
            ),
            
            // Timeline of achievements
            React.createElement(
              'div',
              { className: 'space-y-8' },
              achievements.map((item, index) => 
                React.createElement(
                  'div',
                  { 
                    key: item.id, // Use a unique ID as key for stability
                    className: `timeline-item animate-fadeInUp`,
                    style: { animationDelay: `${0.3 + index * 0.1}s` }
                  },
                  [
                    React.createElement('div', { className: 'timeline-dot' }),
                    React.createElement(
                      'div',
                      { className: 'bg-gray-50 p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow' },
                      [
                        React.createElement(
                          'div',
                          { className: 'flex justify-between items-start mb-2' },
                          [
                            React.createElement('span', { className: 'font-bold text-blue-600' }, item.year),
                            item.highlight && React.createElement(
                              'span',
                              { className: 'bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-medium' },
                              '🏆 Highlight'
                            )
                          ]
                        ),
                        React.createElement('h3', { className: 'text-xl font-semibold mb-1' }, item.event),
                        React.createElement('p', { className: 'text-gray-700' }, item.detail)
                      ]
                    )
                  ]
                )
              )
            ),
            
            // Key Learnings Section
            React.createElement(
              'div',
              { className: 'mt-16 bg-blue-50 rounded-xl p-8 animate-fadeInUp', style: { animationDelay: `${0.3 + achievements.length * 0.1}s` } },
              [
                React.createElement('h3', { className: 'text-2xl font-bold text-center mb-6' }, 'Key Learnings'),
                React.createElement(
                  'p',
                  { className: 'text-gray-700 text-lg leading-relaxed max-w-2xl mx-auto' },
                  'Through years of competitive badminton, I have developed resilience, strategic thinking, and the value of consistent hard work. These experiences have shaped my approach to both academic and personal challenges.'
                )
              ]
            )
          ]
        )
      );
    }

    function App() {
      return React.createElement(
        React.Fragment,
        null,
        [
          React.createElement(Header, null),
          React.createElement(BadmintonAchievements, null),
          React.createElement(Footer, null)
        ]
      );
    }

    // ================== Render ==================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App, null));
  </script>
</body>
</html>
