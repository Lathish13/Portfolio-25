<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lathish - Community & Volunteering</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
    tailwind.theme = {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      }
    }
  </script>

    <style>
        /* --- Base & Animation Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        
        @keyframes hero-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-hero-fade-in {
            animation: hero-fade-in 1s ease-out 0.3s forwards;
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .scroll-reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .typewriter-caret {
            width: 3px;
            height: 1.1em;
            background-color: currentColor;
            margin-left: 8px;
            animation: blink-caret 0.75s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { background-color: transparent; }
            50% { background-color: currentColor; }
        }

        /* --- Hero Section Specific Styles --- */
        #hero {
            position: relative;
            overflow: hidden;
            background-color: #052e16; /* green-950 */
        }
        .hero-bg {
            position: absolute;
            top: -10%; right: -10%; bottom: -10%; left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('https://images.unsplash.com/photo-1488521787991-ed7b2f28a727?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1;
        }
        .hero-overlay {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background-color: rgba(5, 46, 22, 0.75); /* green-950 with 75% opacity */
            backdrop-filter: blur(4px);
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 3;
        }
        
        .scroll-down-arrow {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        /* --- Timeline Styling --- */
        .timeline::before {
            content: '';
            position: absolute;
            left: 1.25rem; /* 20px */
            top: 0;
            height: 100%;
            width: 3px;
            background-color: #e2e8f0; /* slate-200 */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- Custom Hooks ---
        const useIntersectionObserver = (options) => {
            const containerRef = React.useRef(null);
            React.useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, options);
                const elements = containerRef.current.querySelectorAll('.scroll-reveal');
                elements.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [options]);
            return containerRef;
        };
        
        const useMousePosition = () => {
            const [mousePosition, setMousePosition] = React.useState({ x: 0, y: 0 });
            React.useEffect(() => {
                const updateMousePosition = ev => setMousePosition({ x: ev.clientX, y: ev.clientY });
                window.addEventListener('mousemove', updateMousePosition);
                return () => window.removeEventListener('mousemove', updateMousePosition);
            }, []);
            return mousePosition;
        };

        // --- Reusable Components ---
        function Header() {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);
            const navLinks = [
                { href: "index.html", text: "Profile" },
                { href: "interest.html", text: "Volunteering" },
                { href: "academics.html", text: "Academics" },
                { href: "badminton.html", text: "Badminton" },
            ];

            return (
                <header className="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            <a href="index.html" className="flex items-center space-x-3 group">
                                <div className="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-md transition-all duration-300 group-hover:bg-blue-700 group-hover:scale-105">
                                    <span className="text-white font-black text-2xl">L</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-900">Lathish</h1>
                                    <p className="text-sm text-slate-500">EAE Portfolio</p>
                                </div>
                            </a>
                            <nav className="hidden md:flex items-center space-x-2">
                                {navLinks.map(link => (
                                    <a key={link.text} href={link.href} className="text-slate-600 hover:text-blue-600 transition-colors px-4 py-2 rounded-lg hover:bg-blue-50 font-medium">
                                        {link.text}
                                    </a>
                                ))}
                            </nav>
                            <div className="md:hidden">
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 rounded-md text-slate-600 hover:bg-slate-100 focus:outline-none">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        {isMobileMenuOpen ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7" />}
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    {isMobileMenuOpen && (
                        <div className="md:hidden bg-white border-t border-slate-200">
                            <nav className="px-2 pt-2 pb-4 space-y-1 sm:px-3">
                                {navLinks.map(link => (
                                    <a key={link.text} href={link.href} className="block text-slate-600 hover:text-blue-600 hover:bg-blue-50 px-3 py-2 rounded-md text-base font-medium">
                                        {link.text}
                                    </a>
                                ))}
                            </nav>
                        </div>
                    )}
                </header>
            );
        }

        function Footer() {
            return (
                <footer className="bg-slate-900 text-white py-12">
                    <div className="text-center text-slate-400">
                        © {new Date().getFullYear()} Lathish - EAE Portfolio
                    </div>
                </footer>
            );
        }
        
        function TypewriterText({ text, speed = 100, initialDelay = 500, className = '' }) {
            const [displayText, setDisplayText] = React.useState('');
            const [showCaret, setShowCaret] = React.useState(true);
            React.useEffect(() => {
                const startTyping = () => {
                    let i = 0;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            setDisplayText(prev => text.substring(0, i + 1));
                            i++;
                        } else {
                            clearInterval(interval);
                            setTimeout(() => setShowCaret(false), 2000);
                        }
                    }, speed);
                };
                const delay = setTimeout(startTyping, initialDelay);
                return () => clearTimeout(delay);
            }, [text, speed, initialDelay]);
            return (
                <span className={`inline-flex items-baseline ${className}`}>
                    <span>{displayText}</span>
                    {showCaret && <span className="typewriter-caret"></span>}
                </span>
            );
        }
        
        function KeyHighlight({ icon, value, label }) {
            return (
                <div className="text-center">
                    <div className="text-4xl text-green-400 mb-2">{icon}</div>
                    <div className="text-2xl font-bold text-white">{value}</div>
                    <div className="text-sm text-slate-300 tracking-wider uppercase">{label}</div>
                </div>
            );
        }

        function VolunteeringHeroSection() {
            const { x, y } = useMousePosition();
            const [windowSize, setWindowSize] = React.useState({ width: 0, height: 0 });
            React.useEffect(() => {
                const handleResize = () => setWindowSize({ width: window.innerWidth, height: window.innerHeight });
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const parallaxX = windowSize.width > 0 ? (x - windowSize.width / 2) / 40 : 0;
            const parallaxY = windowSize.height > 0 ? (y - windowSize.height / 2) / 40 : 0;

            const highlights = [
                { icon: '🤝', value: '5+', label: 'Projects' },
                { icon: '❤️', value: '70+', label: 'Hours Served' },
                { icon: '🧑‍🤝‍🧑', value: 'Community', label: 'Focused' },
            ];

            return (
                <section id="hero" className="h-screen flex flex-col justify-center items-center text-center text-white p-4">
                    <div className="hero-bg" style={{ transform: `translate(${parallaxX}px, ${parallaxY}px)` }}></div>
                    <div className="hero-overlay"></div>
                    <div className="hero-content flex flex-col h-full justify-center">
                        <div className="flex-grow flex flex-col justify-center items-center">
                            <div className="animate-hero-fade-in">
                                <h1 
                                    className="text-5xl md:text-7xl font-black tracking-tight"
                                    style={{textShadow: '0px 4px 15px rgba(0, 0, 0, 0.4)'}}
                                >
                                    My <TypewriterText text="Volunteering Journey" speed={80} initialDelay={1000} className="text-green-400" />
                                </h1>
                                <p className="text-xl text-slate-300 max-w-2xl mx-auto mt-6" style={{textShadow: '0px 2px 8px rgba(0, 0, 0, 0.5)'}}>
                                    A record of my contributions and service to the community.
                                </p>
                            </div>
                            <div className="animate-hero-fade-in" style={{ animationDelay: '0.6s' }}>
                                <div className="grid grid-cols-3 gap-8 md:gap-16 max-w-3xl mx-auto mt-16">
                                    {highlights.map(h => <KeyHighlight key={h.label} {...h} />)}
                                </div>
                            </div>
                        </div>
                        <a href="#involvement" className="scroll-down-arrow flex-shrink-0 pb-8 animate-hero-fade-in" style={{ animationDelay: '1.2s' }}>
                            <svg className="w-8 h-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </a>
                    </div>
                </section>
            );
        }

        function InvolvementSection() {
            const involvement = [
                { year: 2024, type: 'Self-Initiated', title: 'HWSOP24(MDC) Mobile Heartware Network & Youthbank Digital Clinic for Seniors', details: 'Helping the elderly in Singapore, mainly Chinese speaking, to learn the basic and important functions on their personal digital device and advocating them on the dangers and advantages of surfing the internet. Served multiple elderlies of different background and contributed 39 hours.', highlight: '❤️ 39 Hours' },
                { year: 2024, type: 'Student-Initiated', title: 'Laptop refurbishment voluntary service to the organization, SGBono', details: 'Fixing, cleaning, and repairing technology devices so that low-income families can enjoy access to the internet without having a financial burden.' },
                { year: 2024, type: 'Student-Initiated', title: 'Service Learning Fellowship: Below Zero Project with Rainbow Centre', details: 'Helping children with special needs appreciate the surrounding that they have and making them feel like they are more than welcome in any environment.' },
                { year: 2024, type: 'School Initiated', title: 'DSA Booth Open House For Sec 1 Admission', details: 'Advocating and encouraging the newcomers to join my CCA, Badminton, on behalf on the CCA itself.'},
                { year: 2024, type: 'Student-Initiated', title: '2024 S3-06 Hao Ren Hao Shi Service Learning Programme', details: '8 Hours of giving back to the community that has been nothing but kind to us.', highlight: '🤝 8 Hours' },
            ];
            
            const sectionRef = useIntersectionObserver({ threshold: 0.1 });

            return (
                <section id="involvement" className="py-20 sm:py-28 bg-slate-50" ref={sectionRef}>
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-extrabold text-slate-900 tracking-tight">Timeline of Involvement</h2>
                            <p className="text-lg text-slate-600 mt-3 max-w-2xl mx-auto">A detailed overview of my community service and volunteering projects.</p>
                        </div>
                        
                        <div className="relative timeline space-y-12">
                            {involvement.map((item, index) => (
                                <div key={index} className="scroll-reveal pl-12 md:pl-16 relative">
                                    <div className="absolute top-1 -left-1.5 w-6 h-6 rounded-full bg-white border-4 border-green-600 z-10 flex items-center justify-center">
                                        <div className="w-3 h-3 bg-green-600 rounded-full"></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-lg border border-slate-200/80 transition-all duration-300 hover:shadow-2xl hover:border-green-500 hover:-translate-y-1">
                                        {item.highlight && (
                                            <span className="bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full mb-3 inline-block">{item.highlight}</span>
                                        )}
                                        <p className="text-sm font-semibold text-slate-500 mb-2">{item.year} • {item.type}</p>
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">{item.title}</h3>
                                        <p className="text-slate-600">{item.details}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        function PhotoGallery() {
            // Using placeholder images as requested
            const photos = [
                { src: 'https://placehold.co/600x400/a3e635/14532d?text=Volunteering+1', caption: 'Photo from a community project.' },
                { src: 'https://placehold.co/600x400/a3e635/14532d?text=Volunteering+2', caption: 'Working with the team at a volunteering event.' },
                { src: 'https://placehold.co/600x400/a3e635/14532d?text=Volunteering+3', caption: 'A snapshot from the Digital Clinic for Seniors.' },
                { src: 'https://placehold.co/600x400/a3e635/14532d?text=Volunteering+4', caption: 'Engaging with the community.' },
                { src: 'https://placehold.co/600x400/a3e635/14532d?text=Volunteering+5', caption: 'A memorable moment from service learning.' },
            ];
            const [selectedPhoto, setSelectedPhoto] = React.useState(null);
            const galleryRef = useIntersectionObserver({ threshold: 0.1 });

            return (
                <section id="gallery" className="py-20 sm:py-28 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-extrabold text-slate-900 tracking-tight">Gallery</h2>
                            <p className="text-lg text-slate-600 mt-3">Moments from my volunteering journey.</p>
                        </div>
                        <div ref={galleryRef} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                            {photos.map((photo, index) => (
                                <div
                                    key={index}
                                    className="scroll-reveal group rounded-xl shadow-lg border border-slate-200/80 overflow-hidden cursor-pointer"
                                    style={{ transitionDelay: `${index * 100}ms` }}
                                    onClick={() => setSelectedPhoto(photo)}
                                >
                                    <div className="overflow-hidden">
                                        <img src={photo.src} alt={photo.caption} className="w-full h-64 object-cover transform transition-all duration-500 ease-in-out group-hover:scale-110"/>
                                    </div>
                                    <div className="p-4 bg-slate-50">
                                        <p className="text-slate-700 text-center truncate">{photo.caption}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    {selectedPhoto && <GalleryModal photo={selectedPhoto} onClose={() => setSelectedPhoto(null)} />}
                </section>
            );
        }

        function GalleryModal({ photo, onClose }) {
             React.useEffect(() => {
                const handleEsc = (event) => {
                    if (event.keyCode === 27) onClose();
                };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [onClose]);
            if (!photo) return null;
            return (
                <div 
                    className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4"
                    style={{animation: 'fadeIn 0.3s ease'}}
                    onClick={onClose}
                >
                    <div className="bg-white rounded-lg shadow-2xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                        <img src={photo.src} alt={photo.caption} className="w-full h-auto object-contain flex-shrink" style={{maxHeight: 'calc(90vh - 4rem)'}} />
                        <p className="p-4 text-center text-slate-700 bg-slate-50 flex-shrink-0">{photo.caption}</p>
                    </div>
                     <button onClick={onClose} className="absolute top-4 right-4 text-white text-4xl font-bold">&times;</button>
                </div>
            );
        }

        // --- Main App Component ---
        function App() {
            return (
                <div>
                    <Header />
                    <main>
                        <VolunteeringHeroSection />
                        <InvolvementSection />
                        <PhotoGallery />
                    </main>
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
