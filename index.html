<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lathish - EAE Portfolio</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animation styles */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    
    .typewriter {
      border-right: 3px solid;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
    }
    /* Blinking cursor for typewriter effect */
    .typewriter .caret {
      animation: blink-caret 0.75s step-end infinite;
    }
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: inherit; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // ================== Components (Header, Footer, TypewriterText - remain the same) ==================

    function Header() {
      return React.createElement(
        'header',
        { className: 'bg-white shadow-sm sticky top-0 z-50' },
        React.createElement(
          'div',
          { className: 'max-w-6xl mx-auto px-4 py-4' },
          React.createElement(
            'div',
            { className: 'flex items-center justify-between' },
            [
              React.createElement(
                'a', // Use an 'a' tag to make the logo clickable back to home
                { href: 'index.html', className: 'flex items-center space-x-3' },
                [
                  React.createElement(
                    'div',
                    { className: 'w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center' },
                    React.createElement('span', { className: 'text-white font-bold text-xl' }, 'L')
                  ),
                  React.createElement(
                    'div',
                    null,
                    [
                      React.createElement('h1', { className: 'text-2xl font-bold text-gray-900' }, 'Lathish'),
                      React.createElement('p', { className: 'text-sm text-gray-600' }, 'EAE Portfolio')
                    ]
                  )
                ]
              ),
              React.createElement(
                'nav',
                { className: 'hidden md:flex space-x-6' },
                [
                  React.createElement('a', { 
                    href: '#profile', 
                    className: 'text-gray-600 hover:text-blue-600 transition-colors'
                  }, 'Profile'),
                  React.createElement('a', { 
                    href: 'badminton.html', 
                    className: 'text-gray-600 hover:text-blue-600 transition-colors font-medium' 
                  }, 'Badminton'),
                  React.createElement('a', { 
                    href: '#sports', 
                    className: 'text-gray-600 hover:text-blue-600 transition-colors'
                  }, 'Sports'),
                  React.createElement('a', { 
                    href: '#academics', 
                    className: 'text-gray-600 hover:text-blue-600 transition-colors'
                  }, 'Academics')
                ]
              )
            ]
          )
        )
      );
    }

    function Footer() {
      return React.createElement(
        'footer',
        { className: 'bg-gray-900 text-white py-8' },
        React.createElement(
          'div',
          { className: 'max-w-6xl mx-auto px-4 text-center' },
          React.createElement('p', { className: 'text-gray-400' }, '© 2024 Lathish - EAE Portfolio')
        )
      );
    }

    function TypewriterText({ text, speed = 20, initialDelay = 0 }) {
      const [displayText, setDisplayText] = React.useState('');
      const [isTyping, setIsTyping] = React.useState(false);
      
      React.useEffect(() => {
        let timeoutId;
        let intervalId;

        const startTyping = () => {
          setIsTyping(true);
          let i = 0;
          intervalId = setInterval(() => {
            if (i < text.length) {
              setDisplayText(text.substring(0, i + 1));
              i++;
            } else {
              clearInterval(intervalId);
              setIsTyping(false);
            }
          }, speed);
        };

        if (initialDelay > 0) {
          timeoutId = setTimeout(startTyping, initialDelay);
        } else {
          startTyping();
        }
        
        return () => {
          clearTimeout(timeoutId);
          clearInterval(intervalId);
        };
      }, [text, speed, initialDelay]);
      
      return React.createElement(
        'span',
        { className: 'typewriter' },
        [
          displayText,
          isTyping && React.createElement('span', { className: 'caret' }, '|') // Blinking cursor
        ]
      );
    }

    function ProfileSection() {
      return React.createElement(
        'section',
        { id: 'profile', className: 'py-16 bg-gradient-to-r from-blue-50 to-indigo-50 text-center fade-in' },
        React.createElement(
          'div',
          { className: 'max-w-4xl mx-auto px-4' },
          [
            React.createElement(
              'div',
              { className: 'w-32 h-32 mx-auto mb-6 rounded-full overflow-hidden shadow-lg border-4 border-blue-200' },
              React.createElement('img', { src: 'https://via.placeholder.com/128', alt: "Lathish's Profile", className: 'w-full h-full object-cover' })
            ),
            React.createElement(
              'h2',
              { className: 'text-4xl font-extrabold text-gray-900 mb-4 flex justify-center items-center' },
              [
                // Explicitly adding a space here as a string element
                'Hi, I\'m ', 
                React.createElement(TypewriterText, { text: 'Lathish', speed: 100, initialDelay: 500 })
              ]
            ),
            React.createElement(
              'p',
              { className: 'text-xl text-gray-700 leading-relaxed mb-4' },
              'Passionate about sports, technology, and continuous learning. I am currently pursuing my studies at ',
              React.createElement('span', { className: 'font-semibold text-blue-700' }, 'School of Science and Technology, Singapore'),
              '.'
            ),
            React.createElement(
              'p',
              { className: 'text-lg text-gray-600 leading-relaxed mb-6' },
              'My current subjects include: ',
              React.createElement('span', { className: 'font-medium' }, 'English, Tamil, Mathematics, Additional Mathematics, Pure Chemistry, Pure Physics, Humanities (Social Studies + Geography), and Computing.'),
            ),
            React.createElement(
              'div',
              { className: 'flex justify-center space-x-6 text-gray-600 text-lg' },
              [
                React.createElement('p', null, '📍 Singapore'),
                React.createElement('p', null, '🎓 Student'), 
                React.createElement('p', null, '🏸 Badminton Enthusiast')
              ]
            )
          ]
        )
      );
    }

    function BadmintonPreview() {
      return React.createElement(
        'section',
        { className: 'py-12 bg-white fade-in', style: { animationDelay: '0.3s' } },
        React.createElement(
          'div',
          { className: 'max-w-6xl mx-auto px-4' },
          [
            React.createElement(
              'div',
              { className: 'text-center mb-8' },
              [
                React.createElement('h2', { className: 'text-3xl font-bold text-gray-900 mb-4' }, '🏸 Badminton Highlights'),
                React.createElement('p', { className: 'text-lg text-gray-600 max-w-3xl mx-auto' }, 
                  'Consistent representation at school level with multiple achievements')
              ]
            ),
            React.createElement(
              'a',
              { 
                href: 'badminton.html',
                className: 'mx-auto block w-fit px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-md hover:shadow-lg'
              },
              'View Full Badminton Achievements →'
            )
          ]
        )
      );
    }

    function App() {
      return React.createElement(
        'div',
        { className: 'min-h-screen bg-gray-50' },
        [
          React.createElement(Header, null),
          React.createElement(
            'main',
            null,
            [
              React.createElement(ProfileSection, null),
              React.createElement(BadmintonPreview, null),
              // Academics section with embedded map
              React.createElement('section', { id: 'academics', className: 'py-12 bg-white' },
                React.createElement('div', { className: 'max-w-6xl mx-auto px-4 text-center' },
                  [
                    React.createElement('h2', { className: 'text-3xl font-bold text-gray-900 mb-4' }, '📚 Academic Journey'),
                    React.createElement('p', { className: 'text-lg text-gray-600 mb-8' }, 'Learn more about my academic institution and its location.'),
                    React.createElement('div', { className: 'relative overflow-hidden rounded-lg shadow-lg mb-8 mx-auto', style: { paddingBottom: '56.25%', height: 0, maxWidth: '800px' } }, // Responsive embed container
                      React.createElement(
                        'iframe',
                        {
                          src: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3988.759902640283!2d103.77169467475143!3d1.313653199679126!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31da1a3e1f0e4b7b%3A0x6b4f7a5d9a9f2b1!2sSchool%20of%20Science%20and%20Technology%2C%20Singapore!5e0!3m2!1sen!2ssg!4v1719600000000!5m2!1sen!2ssg', // Google Maps embed URL
                          width: '100%',
                          height: '100%',
                          style: { border: 0, position: 'absolute', top: 0, left: 0 },
                          allowFullScreen: '',
                          loading: 'lazy',
                          referrerPolicy: 'no-referrer-when-downgrade'
                        }
                      )
                    ),
                    React.createElement('p', { className: 'text-md text-gray-500' }, 'School of Science and Technology, Singapore - 1 Technology Drive, Singapore 138572')
                  ]
                )
              )
            ]
          ),
          React.createElement(Footer, null)
        ]
      );
    }

    // ================== Render ==================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App, null));
  </script>
</body>
</html>
