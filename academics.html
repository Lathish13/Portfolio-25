<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lathish - Academic Accomplishments</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
    tailwind.theme = {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      }
    }
  </script>

    <style>
        /* --- Base & Animation Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        
        @keyframes hero-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-hero-fade-in {
            animation: hero-fade-in 1s ease-out 0.3s forwards;
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .scroll-reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .typewriter-caret {
            width: 3px;
            height: 1.1em;
            background-color: currentColor;
            margin-left: 8px;
            animation: blink-caret 0.75s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { background-color: transparent; }
            50% { background-color: currentColor; }
        }

        /* --- Hero Section Specific Styles --- */
        #hero {
            position: relative;
            overflow: hidden;
            background-color: #1e1b4b; /* indigo-950 */
        }
        .hero-bg {
            position: absolute;
            top: -10%; right: -10%; bottom: -10%; left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('https://images.unsplash.com/photo-1521747116042-5a810fda9664?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1;
        }
        .hero-overlay {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background-color: rgba(30, 27, 75, 0.75); /* indigo-950 with 75% opacity */
            backdrop-filter: blur(4px);
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 3;
        }
        
        .scroll-down-arrow {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        /* --- Timeline Styling --- */
        .timeline::before {
            content: '';
            position: absolute;
            left: 1.25rem; /* 20px */
            top: 0;
            height: 100%;
            width: 3px;
            background-color: #e2e8f0; /* slate-200 */
        }

    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- Custom Hooks ---
        const useIntersectionObserver = (options) => {
            const containerRef = React.useRef(null);
            React.useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, options);
                const elements = containerRef.current.querySelectorAll('.scroll-reveal');
                elements.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [options]);
            return containerRef;
        };
        
        const useMousePosition = () => {
            const [mousePosition, setMousePosition] = React.useState({ x: 0, y: 0 });
            React.useEffect(() => {
                const updateMousePosition = ev => setMousePosition({ x: ev.clientX, y: ev.clientY });
                window.addEventListener('mousemove', updateMousePosition);
                return () => window.removeEventListener('mousemove', updateMousePosition);
            }, []);
            return mousePosition;
        };

        // --- Reusable Components ---
        function Header() {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);
            // --- Nav links updated to include the new Gallery page ---
            const navLinks = [
                { href: "index.html", text: "Profile" },
                { href: "interest.html", text: "Volunteering" },
                { href: "academics.html", text: "Academics" },
                { href: "badminton.html", text: "Badminton" },
                { href: "gallery.html", text: "Accolades" },
            ];

            return (
                <header className="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            <a href="index.html" className="flex items-center space-x-3 group">
                                <img 
                                    src="images/sydney.jpeg" 
                                    alt="Lathish" 
                                    className="w-12 h-12 rounded-full object-cover shadow-md transition-all duration-300 group-hover:scale-105"
                                />
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-900">Lathish</h1>
                                    <p className="text-sm text-slate-500">EAE Portfolio</p>
                                </div>
                            </a>
                            <nav className="hidden md:flex items-center space-x-2">
                                {navLinks.map(link => (
                                    <a key={link.text} href={link.href} className={`text-slate-600 hover:text-indigo-600 transition-colors px-4 py-2 rounded-lg hover:bg-indigo-50 font-medium ${window.location.pathname.includes(link.href) ? 'text-indigo-600 bg-indigo-50' : ''}`}>
                                        {link.text}
                                    </a>
                                ))}
                            </nav>
                            <div className="md:hidden">
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 rounded-md text-slate-600 hover:bg-slate-100 focus:outline-none">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        {isMobileMenuOpen ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7" />}
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    {isMobileMenuOpen && (
                        <div className="md:hidden bg-white border-t border-slate-200">
                            <nav className="px-2 pt-2 pb-4 space-y-1 sm:px-3">
                                {navLinks.map(link => (
                                    <a key={link.text} href={link.href} className={`block text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 px-3 py-2 rounded-md text-base font-medium ${window.location.pathname.includes(link.href) ? 'text-indigo-600 bg-indigo-50' : ''}`}>
                                        {link.text}
                                    </a>
                                ))}
                            </nav>
                        </div>
                    )}
                </header>
            );
        }

        function Footer() {
            return (
                <footer className="bg-slate-900 text-white py-12">
                    <div className="text-center text-slate-400">
                        © {new Date().getFullYear()} Lathish - EAE Portfolio
                    </div>
                </footer>
            );
        }
        
        function TypewriterText({ text, speed = 100, initialDelay = 500, className = '' }) {
            const [displayText, setDisplayText] = React.useState('');
            const [showCaret, setShowCaret] = React.useState(true);
            React.useEffect(() => {
                const startTyping = () => {
                    let i = 0;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            setDisplayText(prev => text.substring(0, i + 1));
                            i++;
                        } else {
                            clearInterval(interval);
                            setTimeout(() => setShowCaret(false), 2000);
                        }
                    }, speed);
                };
                const delay = setTimeout(startTyping, initialDelay);
                return () => clearTimeout(delay);
            }, [text, speed, initialDelay]);
            return (
                <span className={`inline-flex items-baseline ${className}`}>
                    <span>{displayText}</span>
                    {showCaret && <span className="typewriter-caret"></span>}
                </span>
            );
        }
        
        function KeyHighlight({ icon, value, label }) {
            return (
                <div className="text-center">
                    <div className="text-4xl text-blue-400 mb-2">{icon}</div>
                    <div className="text-2xl font-bold text-white">{value}</div>
                    <div className="text-sm text-slate-300 tracking-wider uppercase">{label}</div>
                </div>
            );
        }

        function AcademicsHeroSection() {
            const { x, y } = useMousePosition();
            const [windowSize, setWindowSize] = React.useState({ width: 0, height: 0 });
            React.useEffect(() => {
                const handleResize = () => setWindowSize({ width: window.innerWidth, height: window.innerHeight });
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const parallaxX = windowSize.width > 0 ? (x - windowSize.width / 2) / 40 : 0;
            const parallaxY = windowSize.height > 0 ? (y - windowSize.height / 2) / 40 : 0;

            const highlights = [
                { icon: '🥇', value: 'Gold', label: 'International Event' },
                { icon: '🌍', value: '3+', label: 'Intl. Representations' },
                { icon: '📈', value: 'Edusave', label: 'Good Progress' },
            ];

            return (
                <section id="hero" className="h-screen flex flex-col justify-center items-center text-center text-white p-4">
                    <div className="hero-bg" style={{ transform: `translate(${parallaxX}px, ${parallaxY}px)` }}></div>
                    <div className="hero-overlay"></div>
                    <div className="hero-content flex flex-col h-full justify-center">
                        <div className="flex-grow flex flex-col justify-center items-center">
                            <div className="animate-hero-fade-in">
                                <h1 
                                    className="text-5xl md:text-7xl font-black tracking-tight"
                                    style={{textShadow: '0px 4px 15px rgba(0, 0, 0, 0.4)'}}
                                >
                                    My <TypewriterText text="Academic Journey" speed={80} initialDelay={1000} className="text-blue-400" />
                                </h1>
                                <p className="text-xl text-slate-300 max-w-2xl mx-auto mt-6" style={{textShadow: '0px 2px 8px rgba(0, 0, 0, 0.5)'}}>
                                    A record of my achievements, awards, and key learning experiences.
                                </p>
                            </div>
                            <div className="animate-hero-fade-in" style={{ animationDelay: '0.6s' }}>
                                <div className="grid grid-cols-3 gap-8 md:gap-16 max-w-3xl mx-auto mt-16">
                                    {highlights.map(h => <KeyHighlight key={h.label} {...h} />)}
                                </div>
                            </div>
                        </div>
                        <a href="#accomplishments" className="scroll-down-arrow flex-shrink-0 pb-8 animate-hero-fade-in" style={{ animationDelay: '1.2s' }}>
                            <svg className="w-8 h-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </a>
                    </div>
                </section>
            );
        }

        function AccomplishmentsSection() {
            const accomplishments = [
                { year: 2024, title: 'Global Citizenship Education', event: 'Space Shuttle Research Trip to Hainan, China', details: 'Immersed into the Chinese culture and science sector during a school-organized research trip in November.', teacher: 'Mr Allan Low', highlight: '✈️ International Trip' },
                { year: 2024, title: 'Infocomm Technology (Computing)', event: 'Perse Coding Team Challenge (Round 1)', details: 'Represented School at International Event.', teacher: 'Mr. Robin Pang' },
                { year: 2024, title: 'Tamil Language', event: 'SST Book Prize (S3)', details: 'Awarded to student with highest results in cohort to related subject.', teacher: 'Mr. Samath' },
                { year: 2024, title: 'Student Leadership (HOUSE)', event: 'Upper Sec House Committee', details: 'Facilitated the 2024 Sec 2 Outdoor Education Expedition Program.', teacher: 'Mr Ng Jun Wei' },
                { year: 2023, title: 'Infocomm Technology (Computing)', event: 'Perse Coding (Final Round)', details: 'Represented School and obtained Gold Award at International Event.', teacher: 'Mr Robin Pang', highlight: '🥇 Gold Award' },
                { year: 2023, title: 'Science Club', event: 'Young Inventors Challenge', details: 'Represented School and presented Research Paper/Project at International Event.', teacher: 'N.A' },
                { year: 2023, title: 'English Culture and Language', event: 'Secondary 2 Student Congress', details: 'N/A', teacher: 'N.A' },
                { year: 2023, title: 'Secondary 2 Geography Performance Task', event: '(Market Place)', details: 'Represented Class at Intra-School Event and achieved Best Project - First Runner Up.', teacher: 'Ms. Ruth Loh', highlight: '🥈 1st Runner Up' },
                { year: 2023, title: 'Edusave Good Progress Award 2023', event: 'Academic Performance', details: 'For improvement in academic performance and demonstrating good conduct.', teacher: 'N.A', highlight: '📈 Good Progress' },
                { year: 2023, title: 'Student Leadership (HOUSE)', event: 'House Committee', details: 'Completed LoS 1 Stages of Group Development (OEE Training) and Outdoor Education Expedition (OEE).', teacher: 'Mr Ng Jun Wei' },
            ];
            
            const sectionRef = useIntersectionObserver({ threshold: 0.1 });

            return (
                <section id="accomplishments" className="py-20 sm:py-28 bg-slate-50" ref={sectionRef}>
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl font-extrabold text-slate-900 tracking-tight">Timeline of Accomplishments</h2>
                            <p className="text-lg text-slate-600 mt-3 max-w-2xl mx-auto">A detailed overview of my academic and co-curricular achievements.</p>
                        </div>
                        
                        <div className="relative timeline space-y-12">
                            {accomplishments.map((item, index) => (
                                <div key={index} className="scroll-reveal pl-12 md:pl-16 relative">
                                    <div className="absolute top-1 -left-1.5 w-6 h-6 rounded-full bg-white border-4 border-blue-600 z-10 flex items-center justify-center">
                                        <div className="w-3 h-3 bg-blue-600 rounded-full"></div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-lg border border-slate-200/80 transition-all duration-300 hover:shadow-2xl hover:border-blue-500 hover:-translate-y-1">
                                        {item.highlight && (
                                            <span className="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full mb-3 inline-block">{item.highlight}</span>
                                        )}
                                        <p className="text-sm font-semibold text-slate-500 mb-2">{item.year} • {item.title}</p>
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">{item.event}</h3>
                                        {item.details !== 'N/A' && <p className="text-slate-600">{item.details}</p>}
                                        {item.teacher !== 'N.A' && (
                                            <p className="text-sm text-slate-400 mt-4">Teacher-in-charge: <span className="font-medium text-slate-500">{item.teacher}</span></p>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        // --- Main App Component ---
        function App() {
            return (
                <div>
                    <Header />
                    <main>
                        <AcademicsHeroSection />
                        <AccomplishmentsSection />
                    </main>
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
